<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>настройки — fain</title>
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('fain_theme_v1') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        var scale = localStorage.getItem('fain_scale_v1');
        if (scale && scale !== '100%') {
          document.documentElement.style.fontSize = (parseInt(scale) / 100) * 15 + 'px';
        }
        var css = localStorage.getItem('fain_custom_css_v1');
        if (css) {
          var style = document.createElement('style');
          style.id = 'fain-custom-css';
          style.textContent = css;
          document.head.appendChild(style);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <!-- Боковые ASCII синусоидные графики для ПК -->
  <pre id="ascii-left" class="ascii-side ascii-left" aria-hidden="true"></pre>
  <pre id="ascii-right" class="ascii-side ascii-right" aria-hidden="true"></pre>

  <!-- Скрывающаяся верхняя панель -->
