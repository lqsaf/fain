name: fa-verify

"on":
  pull_request:
    branches: [main]
  push:
    branches: [fa/work]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fa-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Invariants
        run: npm run verify

      - name: Diff guard
        if: github.event_name == 'pull_request'
        run: node scripts/verify.mjs --diff "origin/${{ github.base_ref }}" --json

      - name: Detect model or prompt changes
        id: model_changes
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/fa/work'
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE_REF...HEAD" | grep -Eq '^(scripts/fa/(config|loop|models|prompts|runner|eval)\.mjs|opencode\.jsonc|\.opencode/agents/fa(-planner|-reviewer|-scarce)?\.md|\.github/workflows/fa(-verify)?\.yml)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require trusted model-evaluation runner for external PRs
        if: steps.model_changes.outputs.changed == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Model or prompt changes require provider-backed evaluation with repository secrets."
          echo "A maintainer must run fa-verify with workflow_dispatch on a trusted repository branch containing the change."
          exit 1

      - name: Install OpenCode for model evaluation
        if: steps.model_changes.outputs.changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          set -euo pipefail
          npm install -g "@opencode/cli@${{ vars.OPENCODE_VERSION || 'latest' }}"
          opencode --version

      - name: Evaluate configured model routes
        if: steps.model_changes.outputs.changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_API_KEY_2 || secrets.GEMINI_API_KEY_3 || secrets.GEMINI_API_KEY_4 || secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          FA_NVIDIA_RPM: ${{ vars.FA_NVIDIA_RPM }}
          FA_NVIDIA_TPM: ${{ vars.FA_NVIDIA_TPM }}
          FA_NVIDIA_RPD: ${{ vars.FA_NVIDIA_RPD }}
        run: >-
          npm run fa:eval -- --suite model
          --models nvidia/nemotron-3-ultra-550b-a55b,nvidia/nemotron-3.5-super-vl-120b-a12b,nvidia/glm-5.3-flash,nvidia/minimax-m3.1-flash,nvidia/laguna-xs-2.1,nvidia/nemotron-3.5-lightning-30b-a3b,google/gemini-4-hydrogen,google/gemini-3.8-flash,google/gemini-3.6-flash,google/gemini-2.5-flash,google/gemini-3.5-flash-lite,google/gemini-3.1-flash-lite
          --timeout 12

      - name: Upload model evaluation report
        if: always() && steps.model_changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fa-model-eval-${{ github.run_id }}
          path: fa/eval
          retention-days: 14
          if-no-files-found: ignore
