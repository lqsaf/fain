name: fa-verify

"on":
  pull_request:
    branches: [main]
  push:
    branches: [fa/work]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fa-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Invariants
        run: npm run verify

      - name: Diff guard
        if: github.event_name == 'pull_request'
        run: node scripts/verify.mjs --diff "origin/${{ github.base_ref }}" --json
