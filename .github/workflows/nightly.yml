name: nightly

on:
  schedule:
    # 22:00 UTC = 01:00 MSK. Scheduled workflows run from the default branch.
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  # Change this to the model you want to use.
  OPENCODE_MODEL: anthropic/claude-sonnet-5-5

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # The agent must not receive Git credentials.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCode
        run: npm install --global @opencode/cli

      - name: Run the nightly agent
        env:
          # Pick one auth method and keep only that one.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${OPENCODE_AUTH_JSON:-}" ]; then
            printf '%s' "$OPENCODE_AUTH_JSON" > "$RUNNER_TEMP/auth.json"
            opencode auth import "$RUNNER_TEMP/auth.json"
            rm -f "$RUNNER_TEMP/auth.json"
          fi
          opencode run --standalone --auto --archived \
            --model "$OPENCODE_MODEL" \
            --agent nightly \
            "Run the nightly queue. Follow .opencode/agents/nightly.md."

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes produced. Nothing to commit."
            exit 0
          fi
          BRANCH="nightly/$(date -u +%Y-%m-%d-%H%M)"
          git config user.name "opencode-nightly[bot]"
          git config user.email "opencode-nightly[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "nightly: automated changes $(date -u +%F)"
          gh auth setup-git
          git push origin "$BRANCH"
          gh pr create \
            --base "${GITHUB_REF_NAME:-main}" \
            --head "$BRANCH" \
            --title "Nightly: $(date -u +%F)" \
            --body "Automated nightly run. Review the diff and wait for CI before merging."
